<div id="root"></div><script>if(location.pathname==='/intake'){document.getElementById('root').innerHTML='<div class="public-intake"><section><h1>LeadFlow Enquiry</h1><p>Tell us what you are looking for and the team will follow up.</p><form id="intake"><input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email"><input name="phone" placeholder="Phone / WhatsApp"><input name="propertyType" placeholder="Property type"><input name="location" placeholder="Preferred location"><input name="budget" placeholder="Budget"><input name="timeline" placeholder="Timeline"><textarea name="enquiry" maxlength="5000" placeholder="How can we help?" required></textarea><input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px"><button>Submit enquiry</button><p id="msg"></p></form></section></div>';document.getElementById('intake').onsubmit=async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),token=new URLSearchParams(location.search).get('token'),m=document.getElementById('msg');m.textContent='Submitting…';let r=await fetch('/api/intake',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...f,token})}),j=await r.json();m.textContent=r.ok?'Thanks — your enquiry has been received.':(j.error||'Could not submit.')}}else{let s=document.createElement('script');s.type='module';s.src='/src/main.tsx';document.body.appendChild(s)}</script>
