<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>LeadFlow AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      if (location.pathname === '/intake') {
        document.getElementById('root').innerHTML = '<div class="public-intake"><section><h1>LeadFlow Enquiry</h1><p>Tell us what you are looking for and the team will follow up.</p><form id="intake"><input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email"><input name="phone" placeholder="Phone / WhatsApp"><select name="category"><option value="General Enquiry">General enquiry</option><option value="Product Interest">Product interest</option><option value="Service Request">Service request</option><option value="Support">Support</option><option value="Partnership">Partnership</option><option value="Other">Other</option></select><input name="productOrService" placeholder="Product or service (optional)"><input name="location" placeholder="Location / service area (optional)"><input name="estimatedValue" placeholder="Estimated value (optional)"><input name="timeline" placeholder="Timeline"><textarea name="enquiry" maxlength="5000" placeholder="How can we help?" required></textarea><input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px"><button>Submit enquiry</button><p id="msg"></p></form></section></div>';
        document.getElementById('intake').onsubmit = async (e) => {
          e.preventDefault();
          const form = Object.fromEntries(new FormData(e.target));
          const token = new URLSearchParams(location.search).get('token');
          const message = document.getElementById('msg');
          message.textContent = 'Submitting…';
          try {
            const response = await fetch('/api/intake', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ ...form, token })
            });
            const result = await response.json();
            message.textContent = response.ok
              ? 'Thanks — your enquiry has been received.'
              : (result.error || 'Could not submit.');
          } catch {
            message.textContent = 'Could not submit. Please try again.';
          }
        };
      } else {
        await import('/src/main.tsx');
      }
    </script>
  </body>
</html>
